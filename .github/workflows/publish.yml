name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to publish
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm 11 for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install Chrome (stable)
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
        id: setup-chrome

      - name: Install dependencies
        run: npm ci

      - name: Run Biome checks
        run: npm run check

      - name: Audit production dependencies
        run: npm run audit

      - name: Run tests
        run: npm test
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Validate npm package contents
        run: npm run pack:dry-run

      - name: Validate release version
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v$package_version"

      - name: Build MCPB bundle
        run: npm run mcpb:build

      - name: Upload MCPB to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.mcpb --clobber

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
